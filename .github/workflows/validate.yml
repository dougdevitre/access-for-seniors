name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run skill validation
        run: bash scripts/validate.sh

      - name: Run content assertion tests
        run: bash tests/content-checks.sh

      - name: Build skill package
        run: bash scripts/build-skill.sh --skip-validate

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests for the ledger check
        run: node --test scripts/test/check-facts.test.mjs

      # facts/ledger.json records every verified phone number, dollar figure,
      # deadline and program-status claim with its primary source and date.
      # Fails when a fact is past its recheck date, a listed file is missing,
      # or the value no longer appears in any listed file.
      - name: Check the fact ledger
        run: node scripts/check-facts.mjs

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: access-for-seniors-skill
          path: dist/access-for-seniors.skill
          if-no-files-found: error
